name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wood-house/package-lock.json
      - name: Build wood-house
        working-directory: wood-house
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r wood-house/dist site/wood-house
          mkdir -p site/carbon-story
          cp carbon-story/index.html carbon-story/carbon-story.json site/carbon-story/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
