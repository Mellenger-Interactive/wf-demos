  <script>window.csData = fetch('carbon-story.json').then(function (r) { return r.text(); });</script>
  <style>
    :root { --fg: #1F2B1E; --muted: #5E6E5C; --accent: #2F6B3A; --bg: #FFFFFF; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
    main { max-width: 1140px; margin: 0 auto; padding: 16px 16px 32px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 16px; }

    /* ---- Component ----
       .cs-viewport is the visible window. .cs-scene is the 1228x1072 Figma frame; everything inside
       it is positioned in % of it, and it is zoomed/panned with a CSS transform. */
    /* The overview shows only the illustration's bounding box (CROP below), not the Figma frame's empty margins.
       The width is capped so the graphic plus the buttons fit in one browser window. */
    .cs { max-width: min(1140px, calc((100svh - 200px) * 1140 / 740)); margin: 0 auto; }
    .cs-viewport { position: relative; width: 100%; aspect-ratio: 1140 / 740; overflow: hidden; touch-action: pan-y; }
    .cs-viewport.is-zoomed { cursor: grab; touch-action: none; }
    .cs-viewport.is-dragging { cursor: grabbing; }
    .cs-scene { position: absolute; left: 0; top: 0; width: calc(1228 / 1140 * 100%); height: calc(1072 / 740 * 100%); transform-origin: 0 0;
                transition: transform 700ms cubic-bezier(.65, 0, .35, 1); will-change: transform; }
    .cs-viewport.is-dragging .cs-scene { transition: none; }
    .cs-scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    /* static construction zone: a paused frame of the full-length animation. Only its ground is clipped to the
       zone; objects are shown whole if they stand inside the zone and hidden if they don't (see cullObjects). */
    .cs-lottie-static { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .cs-lottie-static > svg { opacity: 0; transition: opacity 300ms ease; }   /* hidden until trimmed to the zone */
    .cs-lottie-static.is-ready > svg { opacity: 1; }
    /* clip-path: the outer 3px of the 600px canvas are pure white (soft edge); trimming them hides a hairline that
       browsers leave where the soft edge and the animation are both cut at the canvas border */
    .cs-lottie { clip-path: inset(0.5%); position: absolute; left: 7.4243%; top: 30.9394%; width: 48.8599%; height: 55.9701%; pointer-events: none;
                 opacity: 0; visibility: hidden; transition: opacity 600ms ease, visibility 0s linear 600ms; }
    .cs-scene[data-focus="construction"] .cs-lottie { opacity: 1; visibility: visible; transition: opacity 600ms ease 150ms; }

    /* focus: when zoomed to an area, everything else fades out completely.
       In the construction zone the static art is swapped for the animation. */
    [data-area] { transition: opacity 600ms ease; }
    .cs-scene[data-focus="forest"] [data-area]:not([data-area="forest"]),
    .cs-scene[data-focus="sawmill"] [data-area]:not([data-area="sawmill"]),
    .cs-scene[data-focus="construction"] [data-area] { opacity: 0; }
    .cs-scene[data-focus] .cs-zone:not([aria-current="true"]) { pointer-events: none; }

    /* zone hit areas */
    .cs-hit { pointer-events: none; }
    .cs-zone { pointer-events: all; fill: transparent; stroke: transparent; stroke-width: 3;
               vector-effect: non-scaling-stroke; cursor: zoom-in; transition: fill 200ms, stroke 200ms; outline: none; }
    .cs-zone:hover { fill: rgba(255, 255, 255, .12); stroke: rgba(47, 107, 58, .55); }
    .cs-zone:focus-visible { stroke: var(--accent); fill: rgba(255, 255, 255, .12); }
    .cs-zone[aria-current="true"] { cursor: inherit; fill: transparent; stroke: transparent; }

    /* controls */
    .cs-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin-top: 12px; }
    .cs-group { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
    button { font: 500 0.9rem system-ui, sans-serif; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--accent);
             background: #fff; color: var(--accent); cursor: pointer; min-height: 40px; }
    button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    button:disabled { opacity: .4; cursor: default; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .cs-zoom button { width: 40px; padding: 0; font-size: 1.2rem; line-height: 1; }
    .cs-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    @media (prefers-reduced-motion: reduce) { .cs-scene, .cs-zone, [data-area], .cs-lottie { transition: none !important; } }
    footer { margin-top: 32px; font-size: 0.85rem; }
    a { color: var(--accent); }
  </style>

          <div id="cs-lottie-static" class="cs-lottie-static" data-area="construction" aria-hidden="true"></div>
          <div id="cs-lottie" class="cs-lottie" aria-hidden="true"></div>
          <svg class="cs-hit" viewBox="0 0 1228 1072" aria-hidden="false">
            <polygon class="cs-zone" data-zone="forest" tabindex="0" role="button" aria-label="Zoom in to the forest"
                     points="636.68,279.17 357.33,441.06 613.62,589.25 894.01,427.35"/>
            <polygon class="cs-zone" data-zone="sawmill" tabindex="0" role="button" aria-label="Zoom in to the sawmill"
                     points="892.98,427.36 613.62,589.25 869.91,737.44 1150.3,575.54"/>
            <polygon class="cs-zone" data-zone="construction" tabindex="0" role="button" aria-label="Zoom in to the construction site"
                     points="357.33,441.06 80.12,601.7 590.74,896.95 869.91,737.44"/>
          </svg>
        </div>
      </div>

      <div class="cs-controls">
        <div class="cs-group" role="group" aria-label="Go to a part of the story">
          <button type="button" data-goto="overview" aria-pressed="true">Overview</button>
          <button type="button" data-goto="forest" aria-pressed="false">Forest</button>
          <button type="button" data-goto="sawmill" aria-pressed="false">Sawmill</button>
          <button type="button" data-goto="construction" aria-pressed="false">Construction</button>
        </div>
        <div class="cs-group cs-zoom" role="group" aria-label="Zoom">
          <button type="button" id="cs-zoom-out" aria-label="Zoom out">&minus;</button>
          <button type="button" id="cs-zoom-in" aria-label="Zoom in">+</button>
        </div>
        <button id="cs-toggle" type="button" aria-controls="cs-lottie" hidden>Pause animation</button>
      </div>
      <div class="cs-status" id="cs-status" aria-live="polite"></div>
    </div>

    <footer><a href="../">All demos</a></footer>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script>
    (function () {
      // ---- Settings -------------------------------------------------------------------------
      // Which part of the construction strip the static overview shows: any frame of the 360-frame
      // loop (0-359). The strip scrolls about 2.4px per frame, so +30 frames moves it ~70px along the road.
      var STILL_FRAME = 272;
      // ----------------------------------------------------------------------------------------
      var W = 1228, H = 1072;            // Figma frame = scene coordinate system
      var ZONE = [[357.33, 441.06], [80.12, 601.7], [590.74, 896.95], [869.91, 737.44]];   // construction diamond
      var CROP = [40, 170, 1140, 740];   // [x, y, w, h] of the illustration inside the Figma frame = the overview
      var VW = CROP[2], VH = CROP[3];      // viewport size in scene units
      var MAX = 4, STEP = 1.5, PAD = 0.04;
      // Zone framing boxes in scene coords [x, y, w, h], including headroom for trees / buildings / cranes.
      var ZONES = {
        overview:     { box: CROP,                       label: 'Overview' },
        forest:       { box: [345, 190, 560, 410],       label: 'Forest' },
        sawmill:      { box: [600, 355, 562, 395],       label: 'Sawmill' },
        construction: { box: [91.17, 331.67, 600, 600], label: 'Construction site' }   // the animation's own window
      };

      var root = document.getElementById('carbon-story');
      var vp = document.getElementById('cs-viewport');
      var scene = document.getElementById('cs-scene');
      var status = document.getElementById('cs-status');
      var zoneEls = root.querySelectorAll('.cs-zone');
      var gotoBtns = root.querySelectorAll('[data-goto]');
      var zoomIn = document.getElementById('cs-zoom-in');
      var zoomOut = document.getElementById('cs-zoom-out');

      // view = scale + translation (scene units). A scene point p is drawn at p * s + t.
      var view = { s: 1, tx: -CROP[0], ty: -CROP[1] }, current = 'overview', onChange = function () {};
      var bounds = CROP;                   // area the view may pan over (scene coords)

      function clamp(v) {
        v.s = Math.min(MAX, Math.max(1, v.s));
        // keep the view within the pannable area (no panning off into empty page)
        v.tx = Math.min(-bounds[0] * v.s, Math.max(VW - (bounds[0] + bounds[2]) * v.s, v.tx));
        v.ty = Math.min(-bounds[1] * v.s, Math.max(VH - (bounds[1] + bounds[3]) * v.s, v.ty));
        return v;
      }
      function apply() {
        clamp(view);
        if (current && current !== 'overview') scene.dataset.focus = current; else delete scene.dataset.focus;
        scene.style.transform = 'translate(' + (view.tx / W * 100) + '%,' + (view.ty / H * 100) + '%) scale(' + view.s + ')';
        vp.classList.toggle('is-zoomed', view.s > 1.001);
        zoomIn.disabled = view.s >= MAX - 0.001;
        zoomOut.disabled = view.s <= 1.001;
        gotoBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.goto === current)); });
        zoneEls.forEach(function (z) { z.setAttribute('aria-current', String(z.dataset.zone === current)); });
        onChange();
      }
      function goTo(name) {
        var b = ZONES[name].box, s = Math.min(VW / b[2], VH / b[3]) * (name === 'overview' ? 1 : 1 - PAD);
        var cx = b[0] + b[2] / 2, cy = b[1] + b[3] / 2;
        view = { s: s, tx: VW / 2 - cx * s, ty: VH / 2 - cy * s };
        // let the view extend past the illustration if that's what it takes to centre this area
        var vx = cx - VW / 2 / s, vy = cy - VH / 2 / s, x0 = Math.min(CROP[0], vx), y0 = Math.min(CROP[1], vy);
        bounds = name === 'overview' ? CROP : [x0, y0,
          Math.max(CROP[0] + CROP[2], vx + VW / s) - x0, Math.max(CROP[1] + CROP[3], vy + VH / s) - y0];
        current = name;
        apply();
        status.textContent = name === 'overview' ? 'Showing the full carbon story' : 'Zoomed in to the ' + ZONES[name].label.toLowerCase();
      }
      function zoomBy(f) {
        var cx = (VW / 2 - view.tx) / view.s, cy = (VH / 2 - view.ty) / view.s;   // keep the centre fixed
        var s = Math.min(MAX, Math.max(1, view.s * f));
        view = { s: s, tx: VW / 2 - cx * s, ty: VH / 2 - cy * s };
        if (s <= 1.001) { current = 'overview'; bounds = CROP; }
        else if (f < 1) current = null;            // zooming out shows the whole story again
        apply();
      }

      // zone clicks / keys
      var dragged = false;
      zoneEls.forEach(function (z) {
        z.addEventListener('click', function () { if (!dragged && z.dataset.zone !== current) goTo(z.dataset.zone); });
        z.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goTo(z.dataset.zone); }
        });
      });
      gotoBtns.forEach(function (b) { b.addEventListener('click', function () { goTo(b.dataset.goto); }); });
      zoomIn.addEventListener('click', function () { zoomBy(STEP); });
      zoomOut.addEventListener('click', function () { zoomBy(1 / STEP); });
      root.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') goTo('overview');
        else if ((e.key === '+' || e.key === '=') && e.target.tagName !== 'INPUT') zoomBy(STEP);
        else if (e.key === '-' || e.key === '_') zoomBy(1 / STEP);
      });

      // drag to pan while zoomed
      var start = null;
      vp.addEventListener('pointerdown', function (e) {
        if (view.s <= 1.001 || e.button !== 0) return;
        start = { x: e.clientX, y: e.clientY, tx: view.tx, ty: view.ty, id: e.pointerId };
        dragged = false;
      });
      vp.addEventListener('pointermove', function (e) {
        if (!start || e.pointerId !== start.id) return;
        var k = VW / vp.clientWidth, dx = (e.clientX - start.x) * k, dy = (e.clientY - start.y) * k;
        if (!dragged && Math.hypot(dx, dy) < 6 * k) return;
        if (!dragged) { dragged = true; vp.classList.add('is-dragging'); vp.setPointerCapture(e.pointerId); }
        view.tx = start.tx + dx; view.ty = start.ty + dy; apply();
      });
      function endDrag() {
        if (!start) return;
        start = null; vp.classList.remove('is-dragging');
        setTimeout(function () { dragged = false; }, 0);   // let the click after a drag be ignored
      }
      vp.addEventListener('pointerup', endDrag);
      vp.addEventListener('pointercancel', endDrag);

      scene.style.transition = 'none';   // no zoom animation on first paint
      apply();
      scene.getBoundingClientRect(); scene.style.transition = '';

      // animation. One download, two players:
      //  - 'still': the full-length strip (fade removed, canvas grown to the whole frame), paused and clipped
      //    to the construction zone. This is what the static overview shows.
      //  - 'anim': the original soft-edged 600x600 animation, shown and played only in the construction view.
      // They swap on the same frame so nothing jumps.
      var btn = document.getElementById('cs-toggle');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var anim = null, still = null, wantPlay = !reduce, wasOn = false;

      // The construction strip is 4 identical copies that scroll end to end. Building each copy is the slow part,
      // so only keep copies whose content is on screen at the given frames.
      var STRIP_BOX = [-228, 134, 1098, 1001];          // strip content bounds inside one copy (+20px margin)
      var OVERVIEW_AREA = [40, 170, 1180, 910];          // what the overview shows (scene coords)
      var ANIM_AREA = [30, 30, 570, 570];                // the 600x600 animation inside its fully-white soft edge
      function keepStrips(d, area, frames) {
        var off = [0, 0];
        d.layers.forEach(function (l) { if (l.nm === 'offset-to-frame') off = l.ks.p.k; });
        d.layers = d.layers.filter(function (l) {
          if (!/^strip/.test(l.nm)) return true;
          var k = l.ks.p.k, a = k[0].s, b = k[k.length - 1].s, t0 = k[0].t, t1 = k[k.length - 1].t;
          return frames.some(function (f) {
            var u = Math.min(1, Math.max(0, (f - t0) / (t1 - t0)));
            var x = off[0] + a[0] + (b[0] - a[0]) * u, y = off[1] + a[1] + (b[1] - a[1]) * u;
            return x + STRIP_BOX[2] > area[0] && x + STRIP_BOX[0] < area[2] && y + STRIP_BOX[3] > area[1] && y + STRIP_BOX[1] < area[3];
          });
        });
        return d;
      }
      function fullLength(d) {
        d.layers = d.layers.filter(function (l) { return l.nm !== 'fade'; });
        var ind = 1 + Math.max.apply(null, d.layers.map(function (l) { return l.ind; }));
        d.layers.forEach(function (l) { if (l.parent === undefined) l.parent = ind; });
        d.layers.push({ ddd: 0, ind: ind, ty: 3, nm: 'offset-to-frame', sr: 1, ip: 0, op: d.op + 1, st: 0, bm: 0, ao: 0,
          ks: { o: { a: 0, k: 0 }, r: { a: 0, k: 0 }, p: { a: 0, k: [91.17, 331.67, 0] }, a: { a: 0, k: [0, 0, 0] }, s: { a: 0, k: [100, 100, 100] } } });
        d.w = W; d.h = H;
        return d;
      }
      function syncAnim() {
        var on = current === 'construction';
        btn.hidden = !on;
        btn.textContent = wantPlay ? 'Pause animation' : 'Play animation';
        if (!anim) return;
        if (on && !wasOn && still) anim.goToAndStop(still.currentFrame, true);     // pick up where the still is
        if (!on && wasOn) {                                                          // leaving: back to the starting frame
          anim.goToAndStop(STILL_FRAME, true);
          showStill(STILL_FRAME);
        }
        if (on && wantPlay) anim.play(); else anim.pause();
        wasOn = on;
      }
      onChange = syncAnim;
      btn.addEventListener('click', function () { wantPlay = !wantPlay; syncAnim(); });

      function inZone(x, y) {           // point-in-polygon, scene coords
        var inside = false;
        for (var i = 0, j = ZONE.length - 1; i < ZONE.length; j = i++) {
          var a = ZONE[i], b = ZONE[j];
          if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
        }
        return inside;
      }
      // Clip only the still's ground to the zone, so objects aren't sliced at the zone's edges.
      function clipGround(a) {
        var ns = 'http://www.w3.org/2000/svg', svg = a.renderer.svgElement;
        var defs = svg.querySelector('defs') || svg.insertBefore(document.createElementNS(ns, 'defs'), svg.firstChild);
        var cp = document.createElementNS(ns, 'clipPath'); cp.id = 'cs-zone-clip';
        var poly = document.createElementNS(ns, 'polygon'); poly.setAttribute('points', ZONE.join(' '));
        cp.appendChild(poly); defs.appendChild(cp);
        a.renderer.elements.forEach(function (el) {
          if (el && el.data.nm === 'ground') {
            var g = document.createElementNS(ns, 'g'); g.setAttribute('clip-path', 'url(#cs-zone-clip)');
            el.layerElement.parentNode.insertBefore(g, el.layerElement); g.appendChild(el.layerElement);
          }
        });
      }
      // Show each object whole if its base stands inside the zone, otherwise hide it.
      // Parts of one object (crane mast + jib + building, truck) are decided together, by their base.
      function groupKey(nm) { return /^(crane|clt)/.test(nm) ? 'site' : nm.replace(/-\d+$/, ''); }
      function cullObjects(a) {
        var box = a.renderer.svgElement.getBoundingClientRect(), k = W / box.width;
        a.renderer.elements.forEach(function (strip) {
          if (!strip || !strip.elements || !/^strip/.test(strip.data.nm)) return;
          var groups = {};
          strip.elements.forEach(function (el) {
            if (!el || !el.layerElement) return;
            el.layerElement.style.visibility = '';
            var r = el.layerElement.getBoundingClientRect();
            if (!r.width && !r.height) return;
            var key = groupKey(el.data.nm) + '|' + (groupKey(el.data.nm) === 'site' || el.data.nm.indexOf('truck') === 0 ? '' : el.data.ind);
            var g = groups[key] || (groups[key] = { els: [], l: Infinity, r: -Infinity, b: -Infinity });
            g.els.push(el);
            // judge an object by where it stands: the crane's swinging jib doesn't count, only its mast + building
            if (/^crane-top/.test(el.data.nm)) return;
            g.l = Math.min(g.l, r.left); g.r = Math.max(g.r, r.right); g.b = Math.max(g.b, r.bottom);
          });
          Object.keys(groups).forEach(function (key) {
            var g = groups[key];
            var x = ((g.l + g.r) / 2 - box.left) * k, y = (g.b - box.top) * k;
            var show = inZone(x, y);
            g.els.forEach(function (el) { el.layerElement.style.visibility = show ? '' : 'hidden'; });
          });
        });
      }
      function showStill(frame) { if (!still) return; still.goToAndStop(frame, true); cullObjects(still); }

      window.csData.then(function (txt) {
        var fast = { progressiveLoad: true };
        still = lottie.loadAnimation({ container: document.getElementById('cs-lottie-static'), renderer: 'svg',
          loop: false, autoplay: false, rendererSettings: fast,
          animationData: keepStrips(fullLength(JSON.parse(txt)), OVERVIEW_AREA, [STILL_FRAME]) });
        still.addEventListener('DOMLoaded', function () {
          showStill(STILL_FRAME);
          clipGround(still);
          cullObjects(still);
          document.getElementById('cs-lottie-static').classList.add('is-ready');
          // build the zoom-in animation once the overview has faded in (building it blocks the page briefly)
          setTimeout(function () {
            var frames = []; for (var f = 0; f < 360; f++) frames.push(f);
            anim = lottie.loadAnimation({ container: document.getElementById('cs-lottie'), renderer: 'svg',
              loop: true, autoplay: false, rendererSettings: fast,
              animationData: keepStrips(JSON.parse(txt), ANIM_AREA, frames) });
            anim.addEventListener('DOMLoaded', function () { anim.goToAndStop(STILL_FRAME, true); wasOn = false; syncAnim(); });
          }, 400);
        });
      });
      syncAnim();
    })();
  </script>
